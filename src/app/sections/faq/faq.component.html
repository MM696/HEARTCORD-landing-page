<section class="faq section" id="faq">
  <div class="container faq__wrap">
    <h2 class="section-title">Frequently Asked Questions</h2>

    <div class="faq__list">
      @for (item of items; track item.question; let i = $index) {
        <div class="faq__item" [class.open]="openIndex() === i">
          <button
            type="button"
            class="faq__trigger"
            [attr.aria-expanded]="openIndex() === i"
            (click)="toggle(i)"
          >
            <span>{{ item.question }}</span>
            <span class="faq__icon" aria-hidden="true">{{ openIndex() === i ? '−' : '+' }}</span>
          </button>
          @if (openIndex() === i) {
            <div class="faq__answer">
              <p>{{ item.answer }}</p>
            </div>
          }
        </div>
      }
    </div>
  </div>
</section>
